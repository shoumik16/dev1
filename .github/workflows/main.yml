
name: My First GitHub Action

# Trigger workflow on push or pull request
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    # Use Ubuntu as the runner
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Display Ubuntu version
      - name: Check Ubuntu version
        run: |
          lsb_release -a

      # Step 3: Print a message
      - name: Hello World
        run: echo "Hello from GitHub Actions!"

      # Step 4: List project files
      - name: List files
        run: ls -la
